<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Things you don't want to see</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 8px;
      }
      textarea,
      input {
        width: 300px;
        padding: 4px;
        font-size: 14px;
        margin-bottom: 12px;
      }
      textarea {
        height: 400px;
        resize: vertical;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      .toggle-row input {
        width: auto;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="toggle-row">
      <input type="checkbox" id="enabled_input" />
      <label for="enabled_input">Enable Filtering</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="trash_only_input" />
      <label for="trash_only_input">Just trash can</label>
    </div>
    <h1>What things do you NOT want to see?</h1>
    <textarea
      id="filter_input"
      placeholder='LinkedIn slop, like "What I learned about {thing}, thread 🧵"'
    ></textarea>
    <h1>OpenAI API Key</h1>
    <input
      id="openai_key_input"
      type="text"
      placeholder="Enter your OpenAI key"
    />
    <script src="popup.js"></script>
  </body>
</html>
